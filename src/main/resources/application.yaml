# Super Admin Configuration
app:
  superadmin:
    email: ${SUPERADMIN_EMAIL:kunalpatil192001@gmail.com}
    username: ${SUPERADMIN_USERNAME:admin}
    password: ${SUPERADMIN_PASSWORD:admin@123}

  base-url: ${APP_BASE_URL:http://localhost:8081}
  
  upload:
    courses:
      dir: ${COURSES_UPLOAD_DIR:./uploads/courses}
      max-file-size: 2MB
      allowed-extensions: jpg,jpeg,png,gif

  csv:
    upload-dir: ${CSV_UPLOAD_DIR:./uploads/csv}
    max-records: 10000

  security:
    cors:
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      max-age: 3600

  timezone: Asia/Kolkata

spring:
  main:
    allow-bean-definition-overriding: true
  
  application:
    name: tts-sms
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:kunalpatil192001@gmail.com}
    password: ${MAIL_PASSWORD:ijpb zhfr ufcw jnpn}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  profiles:
    active: ${SPRING_PROFILE:dev}

  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    time-zone: Asia/Kolkata

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2MB
      location: ${java.io.tmpdir}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 20
          time_zone: Asia/Kolkata
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  thymeleaf:
    enabled: true
    cache: false
    check-template-location: true
    prefix: classpath:/templates/
    suffix: .html
    excluded-view-names: api/**

  mvc:
    static-path-pattern: /**
    contentnegotiation:
      favor-path-extension: false
      favor-parameter: false
    pathmatch:
      use-suffix-pattern: false
      use-registered-suffix-pattern: false

  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /**

server:
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  compression:
    enabled: true
    mime-types: >
      text/html,text/xml,text/plain,text/css,
      text/javascript,application/javascript,
      application/json,application/xml
    min-response-size: 1024

logging:
  level:
    root: INFO
    com.tts.sms: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/sms-application.log
    max-size: 10MB
    max-history: 30