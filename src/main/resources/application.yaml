    password: ${SUPERADMIN_PASSWORD:admin@123}
  backup:
    email: ${BACKUP_EMAIL:kunalpatil192001@gmail.com}
    passcode: ${BACKUP_PASSCODE:Kunal@217}
    google-drive:
      enabled: ${GOOGLE_DRIVE_BACKUP_ENABLED:true}
      client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
      client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
      refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN:}
      credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:credentials/global-email-monitor-e4ef0cd5ef08.json}
      folder-name: ${GOOGLE_DRIVE_FOLDER_NAME:TTS_SMS_Daily_Backups}
      folder-id: ${GOOGLE_DRIVE_FOLDER_ID:15Ltp1XqZ9qbw68v1PBeM8FSO3LmSaggW}

  base-url: ${APP_BASE_URL:https://team.ttsnashik.com}

  upload:
    courses:
      dir: ${COURSES_UPLOAD_DIR:./uploads/courses}
      max-file-size: 2MB
      allowed-extensions: jpg,jpeg,png,gif,webp

  csv:
    upload-dir: ${CSV_UPLOAD_DIR:./uploads/csv}
    max-records: 10000

  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://team.ttsnashik.com,http://35.154.78.128:8080}
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      allowed-headers: "*"
      max-age: 3600

  timezone: Asia/Kolkata

spring:
  main:
    allow-bean-definition-overriding: true

  application:
    name: tts-sms

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:kunalpatil192001@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  profiles:
    active: ${SPRING_PROFILE:dev}

  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    date-format: yyyy-MM-dd
    time-zone: Asia/Kolkata
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 2MB
      location: ${java.io.tmpdir}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 50
          time_zone: Asia/Kolkata
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
        batch_versioned_data: true

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000

  thymeleaf:
    enabled: true
    cache: true
    check-template-location: true
    prefix: classpath:/templates/
    suffix: .html
    excluded-view-names: api/**

  mvc:
    static-path-pattern: /**
    contentnegotiation:
      favor-path-extension: false
      favor-parameter: false
    pathmatch:
      use-suffix-pattern: false
      use-registered-suffix-pattern: false
      trailing-slash-match: true

  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /**

server:
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 3h
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: ${SESSION_COOKIE_HTTP_ONLY:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
      persistent: false 
      store-type: none  

  compression:
    enabled: true
    mime-types: >
      text/html,text/xml,text/plain,text/css,
      text/javascript,application/javascript,
      application/json,application/xml
    min-response-size: 1024

  http2:
    enabled: true

logging:
  level:
    root: INFO
    com.tts.sms: INFO
    org.springframework.web: WARN
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/sms-application.log
    max-size: 10MB
    max-history: 30
