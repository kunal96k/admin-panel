<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Access Denied</title>
    <style>
        .access-denied-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            padding: 2rem;
        }

        .access-denied-icon {
            font-size: 6rem;
            color: #ef4444;
            margin-bottom: 1.5rem;
        }

        .access-denied-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 1rem;
        }

        .access-denied-message {
            font-size: 1.125rem;
            color: #6b7280;
            margin-bottom: 2rem;
            max-width: 600px;
        }

        .access-denied-details {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            max-width: 700px;
        }

        .access-denied-details h4 {
            color: #dc2626;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .access-denied-details p {
            color: #991b1b;
            margin: 0;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 2rem;
            background: #2563eb;
            color: white;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background: #1d4ed8;
            color: white;
        }
    </style>
</head>
<body>
<main layout:fragment="content">
    <div class="access-denied-container">
        <div class="access-denied-icon">
            <i class="bi bi-shield-x"></i>
        </div>

        <h1 class="access-denied-title">Access Denied</h1>

        <p class="access-denied-message">
            You don't have permission to access this resource.
        </p>

        <div class="access-denied-details">
            <h4><i class="bi bi-exclamation-triangle-fill me-2"></i>Security Notice</h4>
            <p th:text="${session.accessDeniedMessage} ?: 'You attempted to access a page or resource that requires special permissions. This incident has been logged for security purposes.'">
                You attempted to access a page or resource that requires special permissions.
            </p>
        </div>

        <a th:href="@{/dashboard}" class="btn-back">
            <i class="bi bi-arrow-left"></i>
            Return to Dashboard
        </a>
    </div>
</main>
</body>
</html>
