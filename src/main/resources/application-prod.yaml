# ============================================
# application-prod.yml (Production Profile)
# ============================================

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  address: 0.0.0.0

  servlet:
    session:
      cookie:
        secure: false
        same-site: lax

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

  http2:
    enabled: true

  max-http-header-size: 48KB

  tomcat:
    max-swallow-size: 30MB
    max-http-post-size: 30MB
    connection-timeout: 60000
    threads:
      max: 200
      min-spare: 10
    accept-count: 100

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tts_crm}?useSSL=true&requireSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      auto-commit: false
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDB103Dialect
        format_sql: false
        jdbc:
          time_zone: Asia/Kolkata
          batch_size: 20
        order_inserts: true
        order_updates: true
        type:
          json_format_mapper: jackson
        generate_statistics: false

  jackson:
    parser:
      allow-unquoted-field-names: false
      allow-single-quotes: false
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
      fail-on-ignored-properties: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 30MB
      file-size-threshold: 5MB
      location: ${java.io.tmpdir}

  thymeleaf:
    cache: true

  web:
    resources:
      cache:
        cachecontrol:
          max-age: 31536000
          cache-public: true
          must-revalidate: true

  security:
    require-ssl: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 20000
          timeout: 20000
          writetimeout: 20000
        debug: false

app:
  upload:
    courses:
      dir: ${COURSES_UPLOAD_DIR:./uploads/courses}
      max-file-size: 2MB
  csv:
    upload-dir: ${CSV_UPLOAD_DIR:./uploads/csv}

  base-url: https://team.ttsnashik.com

  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      allowed-headers: "*"
      max-age: 3600

logging:
  level:
    root: WARN
    com.tts.sms: INFO
    org.springframework: INFO
    org.springframework.web: WARN
    org.springframework.security: INFO
    org.springframework.mail: DEBUG

  file:
    name: logs/sms-application.log
    max-size: 50MB
    max-history: 90

  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"