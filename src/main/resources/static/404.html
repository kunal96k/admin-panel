<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- Google Fonts & Bootstrap/Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            background: linear-gradient(135deg, #090d16 0%, #111827 100%);
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient glow spots */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.12), transparent 70%);
            top: 20%;
            left: 25%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1), transparent 70%);
            bottom: 15%;
            right: 20%;
            pointer-events: none;
        }

        .error-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3.5rem 2.5rem;
            max-width: 540px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            z-index: 5;
            position: relative;
        }

        .brand-logo-txt {
            font-weight: 700;
            font-size: 1.5rem;
            color: #f3f4f6;
            letter-spacing: 1.5px;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: #9ca3af;
            letter-spacing: 1px;
            margin-top: 4px;
            font-weight: 400;
        }

        .error-code {
            font-weight: 800;
            font-size: 7.5rem;
            line-height: 1;
            background: linear-gradient(135deg, #f87171 0%, #ef4444 50%, #b91c1c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 4px 12px rgba(239, 68, 68, 0.2));
            animation: float 4s ease-in-out infinite;
        }

        .error-title {
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: 1.5px;
            color: #f9fafb;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .error-msg {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
            font-weight: 400;
        }

        .btn-action {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            color: white;
            padding: 0.85rem 2rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 38, 38, 0.5);
            background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
            color: white;
        }

        .diagnostic-trigger {
            color: #4b5563;
            font-size: 0.8rem;
            margin-top: 2rem;
            cursor: pointer;
            text-decoration: underline;
            display: inline-block;
            transition: color 0.2s;
        }

        .diagnostic-trigger:hover {
            color: #9ca3af;
        }

        .diagnostic-details {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.75rem;
            text-align: left;
            margin-top: 1rem;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #6b7280;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 576px) {
            .error-card {
                padding: 2.5rem 1.5rem;
                margin: 1rem;
            }
            .error-code {
                font-size: 5.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="brand-logo-txt">
            TechnoKraft
            <span class="brand-subtitle">Training &amp; Solution</span>
        </div>
        
        <div class="error-code">404</div>
        <div class="error-title">Page Not Found</div>
        <p class="error-msg">
            The page you are looking for does not exist, has been removed,<br>
            or is temporarily unavailable.
        </p>

        <a href="/dashboard" class="btn-action">
            <i class="bi bi-arrow-left"></i> Return to Dashboard
        </a>

        <div>
            <span class="diagnostic-trigger" onclick="toggleDiagnostics()">Diagnostic Info</span>
            <div id="diagnostics" class="diagnostic-details" style="display: none;">
                Request URI: <span id="path-val">/unknown</span><br>
                Status Code: 404 Not Found<br>
                Environment: Production (Static Fallback)
            </div>
        </div>
    </div>

    <script>
        document.getElementById('path-val').textContent = window.location.pathname;
        function toggleDiagnostics() {
            var diag = document.getElementById('diagnostics');
            diag.style.display = diag.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</body>
</html>
