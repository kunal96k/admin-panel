# ============================================
# application-dev.yml (Development Profile)
# ============================================
server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework
  ssl:
    enabled: false
  servlet:
    session:
      cookie:
        secure: false
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
    include-exception: true

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:teamtts}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&useLegacyDatetimeCode=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:kunal11}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      auto-commit: false
      connection-test-query: SELECT 1
      connection-timeout: 60000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  web:
    resources:
      cache:
        period: 0

app:
  base-url: http://localhost:8081
  security:
    cors:
      allowed-origins: "*"

logging:
  level:
    root: INFO
    com.tts.sms: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE